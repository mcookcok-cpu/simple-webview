name: Build Simple WebView APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: |
          npm install -g cordova@12
          cordova --version

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest'

      - name: Add Android platform & install plugins
        run: |
          cordova platform add android@11.0.0
          cordova plugin add cordova-plugin-whitelist@1.3.3
          cordova plugin add cordova-plugin-statusbar@3.0.0
          cordova plugin add cordova-plugin-splashscreen@6.0.2

      - name: Build APK (debug)
        run: cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-webview-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest'

      - name: Add Android platform & install plugins
        run: |
          cordova platform add android@11.0.0
          cordova plugin add cordova-plugin-whitelist@1.3.3
          cordova plugin add cordova-plugin-statusbar@3.0.0
          cordova plugin add cordova-plugin-splashscreen@6.0.2

      - name: Build Release APK (unsigned)
        run: cordova build android --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-webview-release
          path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn